# Configuration for typos (https://github.com/crate-ci/typos).
#
# Only entries where the misspelling itself is the point belong here.
# To avoid missing real typos, exclusions use regexes limited to the context
# where the string appears, not blanket word-level allowances.

[default]
extend-ignore-re = [
    # ConnectionConfigResolverTest: verifies that unknown config keys are rejected.
    # The misspelling is the input data itself and cannot be fixed.
    "databse",

    # StrTest: expected value of truncate(); 'hello' cut down to 3 characters.
    "'hel(\\.\\.\\.|…)'",

    # StrTest: data verifying that a combining character (e + U+0301) counts as one grapheme.
    "caf\\\\u\\{0065\\}",

    # An uppercase SQL keyword with a plural s gets its last letter split off and misdetected.
    "SELECTs",

    # LogManagerTest: marker string used to check the order Processors are applied.
    "'BA'",
]
