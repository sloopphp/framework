# typos (https://github.com/crate-ci/typos) の設定。
#
# ここに並ぶのは「綴りが正しくないこと自体に意味がある」箇所のみ。
# 本物の綴り間違いを見逃さないよう、単語単位の一括許可ではなく、
# その文字列が現れる文脈に限定した正規表現で除外する。

[default]
extend-ignore-re = [
    # ConnectionConfigResolverTest: 未知の設定キーを拒否することを検証するテスト。
    # 綴り間違いが入力データそのものなので修正できない。
    "databse",

    # StrTest: truncate() の期待値。'hello' を 3 文字に切り詰めた結果。
    "'hel(\\.\\.\\.|…)'",

    # StrTest: 結合文字 (e + U+0301) が 1 書記素として扱われることの検証データ。
    "caf\\\\u\\{0065\\}",

    # 大文字の SQL キーワードに複数形の s が付くと、末尾 1 文字が切られて誤検出される。
    "SELECTs",

    # LogManagerTest: Processor の適用順を確認するためのマーカー文字列。
    "'BA'",
]
