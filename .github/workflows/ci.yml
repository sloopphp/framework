name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, pdo_sqlite, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # CI runs tests in random order every time to detect order-dependent tests.
      # On failure, pass the Random Seed from the output header to --random-order-seed
      # to reproduce. Local runs keep the executionOrder in phpunit.xml (depends).
      - name: Run tests
        run: vendor/bin/phpunit --exclude-testsuite=Integration --order-by=random

  code-style:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Check code style (PHPCS)
        run: vendor/bin/phpcs

  typos:
    name: Typos
    runs-on: ubuntu-latest
    env:
      TYPOS_VERSION: '1.45.1'
      TYPOS_SHA256: '33447531a0eff29796d6fb9b555b4628723db72c6bad129e168d97ac86ceb0f1'

    steps:
      - uses: actions/checkout@v7

      # Fetch the release binary instead of using the official Action. typos only
      # reads the target files and needs no workflow token or context, so there is
      # no reason to grant it permissions as an Action.
      # The distributor does not publish checksums, so we pin the value measured
      # at adoption time. When bumping the version, measure and replace the SHA256.
      - name: Install typos
        run: |
          url="https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/typos.tar.gz" "$url"
          echo "${TYPOS_SHA256}  ${RUNNER_TEMP}/typos.tar.gz" | sha256sum -c -
          tar xzf "${RUNNER_TEMP}/typos.tar.gz" -C "${RUNNER_TEMP}" ./typos

      # Exclusions are read automatically from _typos.toml at the repository root.
      - name: Check typos
        run: '"${RUNNER_TEMP}/typos"'

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
      SHELLCHECK_VERSION: '0.11.0'
      SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'

    steps:
      - uses: actions/checkout@v7

      # Release binaries rather than the published Actions, for the same reason
      # as typos above: these tools only read files in the checkout and need no
      # workflow token, so there is no reason to run them with Action context.
      # actionlint publishes checksums; the value below was compared against
      # that file at adoption time. shellcheck publishes none, so its value was
      # measured. When bumping either version, measure and replace the SHA256.
      - name: Install actionlint and shellcheck
        run: |
          base='https://github.com/rhysd/actionlint/releases/download'
          url="${base}/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/actionlint.tar.gz" "$url"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint

          base='https://github.com/koalaman/shellcheck/releases/download'
          url="${base}/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -o "${RUNNER_TEMP}/shellcheck.tar.xz" "$url"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -
          tar xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      # actionlint reads the run: blocks through shellcheck when it is on PATH,
      # so the two are installed together and the workflow's shell is checked as
      # part of this step.
      - name: Lint workflows (actionlint)
        # actionlint turns the shellcheck rule off without failing when it
        # cannot run it, and says so only under -verbose. Without this check a
        # broken PATH would leave every run: block unchecked and still green.
        run: |
          set -o pipefail
          PATH="${RUNNER_TEMP}:$PATH" "${RUNNER_TEMP}/actionlint" -verbose 2>&1 \
            | tee "${RUNNER_TEMP}/actionlint.log"
          if grep -q 'Rule "shellcheck" was disabled' "${RUNNER_TEMP}/actionlint.log"; then
            echo 'actionlint did not use shellcheck' >&2
            exit 1
          fi

      # The quality gate script decides whether every other gate passes when it
      # is run locally, so a mistake in its shell is a mistake in all of them.
      # CI does not go through it; it calls each tool directly.
      - name: Lint shell scripts (shellcheck)
        # pipefail is not on by default in a run: block, so a failure of
        # git ls-files would otherwise be hidden by the exit code of xargs.
        # xargs is left without -r on purpose: if the listing ever comes back
        # empty, shellcheck is called with no argument and exits non-zero,
        # rather than passing over nothing.
        run: |
          set -o pipefail
          git ls-files '*.sh' | xargs "${RUNNER_TEMP}/shellcheck"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      # The scan reads commits, not the working tree, so it needs the history
      # rather than the single commit checkout gives by default.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base='https://github.com/gitleaks/gitleaks/releases/download'
          url="${base}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks

      # GitHub's own secret scanning covers this repository, but only for the
      # patterns of providers it partners with. This adds the generic ones -
      # private keys, connection strings - and reads the whole history, so a
      # secret that was committed and later removed is still found.
      #
      # git mode, not dir: the working tree on a runner includes vendor/ and
      # tool caches, whose contents match the generic patterns by chance.
      - name: Scan commits for secrets
        run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact .'

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      # This is a library, so vulnerable dependencies propagate directly to users.
      - name: Audit dependencies
        run: composer audit

      # Using extensions or packages not declared in composer.json breaks only in
      # the user's environment. Conversely, requiring unused dependencies forces
      # unnecessary installs on users.
      - name: Check dependency declarations
        run: vendor/bin/composer-dependency-analyser

  rector:
    name: Rector (PHP version migration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Detects code that deviates from the recommended style for the target PHP
      # version. --dry-run exits non-zero when it proposes changes, so it works
      # as a gate as-is.
      - name: Check PHP version migration (Rector)
        run: vendor/bin/rector process --dry-run --no-progress-bar

  integration-tests:
    name: Integration (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db:
          - name: 'MySQL 8.0'
            image: 'mysql:8.0'
            ping: 'mysqladmin ping -h localhost -uroot -proot'
          - name: 'MariaDB 10.11'
            image: 'mariadb:10.11'
            ping: 'healthcheck.sh --connect --innodb_initialized'
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sloop_test
          MYSQL_USER: sloop
          MYSQL_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sloop_test
          MARIADB_USER: sloop
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.ping }}"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sloop_test
          DB_USER: sloop
          DB_PASS: secret
        run: vendor/bin/phpunit --testsuite=Integration

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite, apcu
          ini-values: apc.enable_cli=1
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Infection (mutation testing)
        run: vendor/bin/infection --threads=4 --no-progress

      - name: Compare escaped mutants against the baseline
        run: php .claude/mutation-baseline.php
