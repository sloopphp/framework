name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, pdo_sqlite, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --exclude-testsuite=Integration

  code-style:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Check code style (PHPCS)
        run: vendor/bin/phpcs

  typos:
    name: Typos
    runs-on: ubuntu-latest
    env:
      TYPOS_VERSION: '1.45.1'
      TYPOS_SHA256: '33447531a0eff29796d6fb9b555b4628723db72c6bad129e168d97ac86ceb0f1'

    steps:
      - uses: actions/checkout@v6

      # 公式 Action ではなくリリースバイナリを取得する。typos は対象ファイルを読む
      # だけで workflow のトークンやコンテキストを必要としないため、Action として
      # 権限を渡す必然性がない。
      # 配布元がチェックサムを公開していないので、導入時に実測した値で固定する。
      # バージョンを上げる際は SHA256 も実測して差し替えること。
      - name: Install typos
        run: |
          url="https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/typos.tar.gz" "$url"
          echo "${TYPOS_SHA256}  ${RUNNER_TEMP}/typos.tar.gz" | sha256sum -c -
          tar xzf "${RUNNER_TEMP}/typos.tar.gz" -C "${RUNNER_TEMP}" ./typos

      # 除外設定はリポジトリ直下の _typos.toml を自動で読む。
      - name: Check typos
        run: "${RUNNER_TEMP}/typos"

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      # ライブラリのため、脆弱な依存はそのまま利用者側へ伝播する。
      - name: Audit dependencies
        run: composer audit

  rector:
    name: Rector (PHP version migration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # 対象 PHP バージョンで推奨される書き方から外れた箇所を検出する。
      # --dry-run は変更提案があると非ゼロ終了するため、そのままゲートになる。
      - name: Check PHP version migration (Rector)
        run: vendor/bin/rector process --dry-run --no-progress-bar

  integration-tests:
    name: Integration (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db:
          - name: 'MySQL 8.0'
            image: 'mysql:8.0'
            ping: 'mysqladmin ping -h localhost -uroot -proot'
          - name: 'MariaDB 10.11'
            image: 'mariadb:10.11'
            ping: 'healthcheck.sh --connect --innodb_initialized'
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sloop_test
          MYSQL_USER: sloop
          MYSQL_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sloop_test
          MARIADB_USER: sloop
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.ping }}"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sloop_test
          DB_USER: sloop
          DB_PASS: secret
        run: vendor/bin/phpunit --testsuite=Integration

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, pdo_sqlite, apcu
          ini-values: apc.enable_cli=1
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Infection (mutation testing)
        run: vendor/bin/infection --threads=4 --no-progress
