version: 2

updates:
  # Composer dependencies (composer.json / composer.lock)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # Group minor / patch updates into a single PR. Keep major updates as
      # individual PRs so breaking changes remain reviewable.
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # GitHub Actions (actions referenced under .github/workflows)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
