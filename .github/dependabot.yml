version: 2

updates:
  # Composer 依存（composer.json / composer.lock）
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # minor / patch はまとめて 1 PR にする。major は個別 PR のままにして、
      # 破壊的変更をレビューできる状態を保つ。
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # GitHub Actions（.github/workflows 配下で参照している action）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
